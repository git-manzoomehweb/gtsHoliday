><!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover"
    />
    <title>[##cms.seo.title|(وكالة السياحة والسفر GTS Holiday)##]</title>
    <meta
      name="description"
      content="[##cms.seo.description|(وكالة السياحة والسفر GTS Holiday)##]"
    />
    <meta name="robots" content="noindex" />
    <basis
      core="dbsource"
      source="hosting"
      name="tag"
      urlid="[##cms.seo.urlid##]"
    >
      <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
      <face filter="key = 'canonical'">
        <link rel="canonical" href="@value" />
      </face>
      <face>
        <meta property="@key" content="@value" />
      </face>
    </basis>
    <basis core="call" file="pwa.inc" lid="3" />
    <basis core="call" file="style.inc" lid="3" />
  </head>
  <body class="ar-multi">
    <basis core="call" file="header.inc" lid="3" />

    <main
      class="pt-[129.5px] overflow-hidden w-full justify-center relative flex"
    >
      <section
        class="w-full my-24 px-8 relative flex flex-col gap-6 items-center justify-center"
      >
        <img
          loading="lazy"
          width="1677"
          height="1676"
          src="[##cms.cms.cdn##]/images/500.png"
          alt="500"
          class="!w-[232px] !h-[232px]"
        />
        <h1 class="text-base text-center text-zinc-900">
          واجهت الاتصال بالخادم مشكلة
        </h1>
        <a
          href="/ar"
          class="bg-primary-600 rounded-xl px-9 py-3 text-white hover:bg-primary-950 hover:shadow-xl"
        >
          العودة إلى الصفحة الرئيسية
        </a>
      </section>
    </main>

    <basis core="call" file="footer.inc" lid="3" />
  </body>
</html>
